<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For you, abc 💞</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0210;--bg2:#2a0620;--ink:#fff0f5;--soft:#ffb3c8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0d0210;--bg2:#2a0620;--ink:#fff0f5}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 45%,var(--bg2),var(--bg) 72%);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 24px 9vh;text-align:center;pointer-events:none}
#line{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(26px,6.5vw,46px);line-height:1.2;max-width:18em;text-shadow:0 2px 24px rgba(255,60,110,.7);transition:opacity .6s,transform .6s}
#line.out{opacity:0;transform:translateY(10px)}
#hint{margin-top:12px;font-size:14px;color:var(--soft);letter-spacing:.04em}
#btns{display:none;gap:16px;margin-top:22px;pointer-events:auto;flex-wrap:wrap;justify-content:center}
button{font:600 18px Nunito,system-ui,sans-serif;border:0;border-radius:999px;padding:14px 34px;cursor:pointer;color:#fff}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
#yes{background:linear-gradient(135deg,#ff4d79,#ff1f5a);box-shadow:0 0 30px rgba(255,77,121,.7);transition:transform .2s}
#no{background:rgba(255,255,255,.14)}
#tap{position:fixed;inset:0;z-index:2}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tap"></div>
<div id="ui">
  <div id="line"></div>
  <div id="hint">tap anywhere to continue</div>
  <div id="btns"><button id="yes">Yes ❤️</button><button id="no">No 🙈</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const NAME = "abc";
const N = innerWidth < 700 ? 9000 : 15000;
const R = Math.random, C = h => new THREE.Color(h);

// ---------- shape generators (each returns {p, c}) ----------
function mk(fn){
  const p = new Float32Array(N*3), c = new Float32Array(N*3), o = {x:0,y:0,z:0,col:null};
  for(let i=0;i<N;i++){ fn(o,i); p.set([o.x,o.y,o.z],i*3); c.set([o.col.r,o.col.g,o.col.b],i*3); }
  return {p,c};
}
const galaxy = () => mk(o=>{
  const r = Math.pow(R(),.6)*7, a = r*1.1 + R()*Math.PI*2;
  o.x = Math.cos(a)*r; o.z = Math.sin(a)*r; o.y = (R()-.5)*.8*(1+r*.1);
  o.col = C(0xff6fa5).lerp(C(0x7a5cff), R());
});
const heart = () => mk(o=>{
  const t = R()*Math.PI*2, s = Math.pow(R(),.25);
  const x = 16*Math.pow(Math.sin(t),3), y = 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
  o.x = x*.17*s; o.y = y*.17*s + .2;
  o.z = (R()-.5)*3.6*Math.sqrt(Math.max(0,1-Math.pow(o.x/2.8,2)))*(1.1-s*.5);
  o.col = C(0xff1f5a).lerp(C(0xffc2d4), Math.pow(R(),2));
});
const rose = () => mk(o=>{
  const k = R();
  if(k < .82){                       // bloom
    const l = Math.pow(R(),.55), a = R()*Math.PI*2;
    const w = Math.abs(Math.sin(2.5*a + 3.4*l));
    const r = l*(1.2+.55*w);
    o.x = Math.cos(a)*r; o.z = Math.sin(a)*r;
    o.y = 1.1 + 1.0*l*l - .3 + w*.15*l;
    o.col = C(0x9a0026).lerp(C(0xff3b6b), l*(.6+.4*w));
  } else if(k < .94){                // stem
    const t = R(); o.x = Math.sin(t*3)*.12; o.z = 0; o.y = 1 - t*4.2;
    o.x += (R()-.5)*.06; o.z += (R()-.5)*.06;
    o.col = C(0x1f9d55).lerp(C(0x7dffb0), R()*.4);
  } else {                           // leaves
    const side = R()<.5 ? -1 : 1, t = R(), u = (R()-.5)*.5;
    o.x = side*(.2 + t*1.3); o.y = -1.2 + t*.8 + Math.sin(t*Math.PI)*.4;
    o.z = u*Math.sin(t*Math.PI)*1.2;
    o.col = C(0x168a49).lerp(C(0x6dffa8), R()*.5);
  }
  o.y -= .3;
});
const sunflower = () => mk(o=>{
  const k = R();
  if(k < .4){                        // seed disc (golden spiral)
    const s = (R()*650)|0, r = .042*Math.sqrt(s), a = s*2.39996;
    o.x = Math.cos(a)*r; o.y = Math.sin(a)*r + .8; o.z = .12*(1-r*r*.8) + (R()-.5)*.08;
    o.col = C(0x7a4a1a).lerp(C(0xd9993a), R()*R());
  } else if(k < .82){                // petals
    const pa = R()*Math.PI*2, layer = R()<.5 ? 0 : 1;
    const w = Math.pow(Math.abs(Math.sin(10.5*pa + layer*.5)),.7);
    const r = 1.1 + R()*w*(layer ? .85 : 1.0);
    o.x = Math.cos(pa)*r; o.y = Math.sin(pa)*r + .8; o.z = -.12*(r-1.1) + layer*-.05 + (R()-.5)*.1;
    o.col = C(0xffb300).lerp(C(0xfff06a), (r-1.1)/1.1 + R()*.2);
  } else if(k < .92){                // stem
    const t = R(); o.x = Math.sin(t*2.5)*.12 + (R()-.5)*.07; o.y = -.2 - t*3.2; o.z = (R()-.5)*.07;
    o.col = C(0x1f9d55).lerp(C(0x7dffb0), R()*.4);
  } else {                           // leaves
    const side = R()<.5 ? -1 : 1, t = R(), u = (R()-.5)*.5;
    o.x = side*(.2 + t*1.3); o.y = -1.6 + t*.7 + Math.sin(t*Math.PI)*.4; o.z = u*Math.sin(t*Math.PI)*1.2;
    o.col = C(0x168a49).lerp(C(0x6dffa8), R()*.5);
  }
});
const textShape = () => {
  const cv = document.createElement('canvas'); cv.width = 700; cv.height = 240;
  const x = cv.getContext('2d'); x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
  let fs = 200; x.font = `italic bold ${fs}px Georgia, serif`;
  while(x.measureText(NAME).width > 640 && fs > 40){ fs -= 10; x.font = `italic bold ${fs}px Georgia, serif`; }
  x.fillText(NAME, 350, 125);
  const d = x.getImageData(0,0,700,240).data, pts = [];
  for(let i=3;i<d.length;i+=4) if(d[i] > 128){ const q=(i-3)/4; pts.push([q%700, Math.floor(q/700)]); }
  return mk(o=>{
    const q = pts[(R()*pts.length)|0] || [350,120];
    o.x = (q[0]-350)/700*7.6; o.y = -(q[1]-125)/700*7.6 + .3; o.z = (R()-.5)*.35;
    o.col = C(0xffffff).lerp(C(0xff8fb0), R()*.8);
  });
};
const blast = () => mk(o=>{
  const v = new THREE.Vector3(R()-.5,R()-.5,R()-.5).normalize().multiplyScalar(8+R()*9);
  o.x=v.x; o.y=v.y; o.z=v.z;
  o.col = [C(0xff1f5a),C(0xffd166),C(0xff8fb0),C(0xffffff)][(R()*4)|0];
});

// ---------- three.js setup ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50,1,.1,100);

const tc = document.createElement('canvas'); tc.width = tc.height = 64;
const g = tc.getContext('2d'), gr = g.createRadialGradient(32,32,0,32,32,32);
gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.35,'rgba(255,255,255,.55)'); gr.addColorStop(1,'rgba(255,255,255,0)');
g.fillStyle = gr; g.fillRect(0,0,64,64);

const geo = new THREE.BufferGeometry();
const cur = galaxy();
geo.setAttribute('position', new THREE.BufferAttribute(cur.p.slice(),3));
geo.setAttribute('color', new THREE.BufferAttribute(cur.c.slice(),3));
const pts = new THREE.Points(geo, new THREE.PointsMaterial({size:.1, map:new THREE.CanvasTexture(tc), vertexColors:true, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending}));
scene.add(pts);

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w,h,false); camera.aspect = w/h;
  camera.position.set(0,1.2, w/h < .8 ? 13.5 : 9.5);
  camera.updateProjectionMatrix();
}
addEventListener('resize',resize); resize();

// ---------- morphing ----------
const shapes = {galaxy:cur, heart:heart(), rose:sunflower(), text:textShape(), blast:blast()};
const delay = new Float32Array(N), dir = new Float32Array(N*3);
for(let i=0;i<N;i++){ delay[i] = R()*.55; dir[i*3]=(R()-.5)*3; dir[i*3+1]=(R()-.5)*3; dir[i*3+2]=(R()-.5)*3; }
let from = {p:cur.p.slice(), c:cur.c.slice()}, to = cur, T = 1, name = 'galaxy';

function go(n){
  from = {p:geo.attributes.position.array.slice(), c:geo.attributes.color.array.slice()};
  to = shapes[n]; name = n; T = 0;
}

let mx = 0;
addEventListener('pointermove', e => { mx = e.clientX/innerWidth - .5; });

const clock = new THREE.Clock(); let spin = 0;
(function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  if(T < 1.6){
    T += dt/1.7;
    const P = geo.attributes.position.array, Cc = geo.attributes.color.array;
    for(let i=0;i<N;i++){
      let p = Math.min(Math.max((T - delay[i])/1.0,0),1);
      const e = p*p*(3-2*p), sw = Math.sin(p*Math.PI);
      for(let k=0;k<3;k++){
        const j = i*3+k;
        P[j] = from.p[j] + (to.p[j]-from.p[j])*e + dir[j]*sw;
        Cc[j] = from.c[j] + (to.c[j]-from.c[j])*e;
      }
    }
    geo.attributes.position.needsUpdate = true; geo.attributes.color.needsUpdate = true;
  }
  const sway = name==='text' ? .15 : .5;
  spin += dt*(name==='galaxy' ? .12 : 0);
  pts.rotation.y = spin + Math.sin(t*.5)*sway + mx*.6;
  const b = name==='heart' ? 1 + .05*Math.pow(Math.sin(t*3.2),4)*2 : 1;
  pts.scale.setScalar(b);
  camera.lookAt(0,.2,0);
  renderer.render(scene,camera);
})();

// ---------- story ----------
const story = [
  {s:'galaxy', t:"Hey " + NAME + " 💞"},
  {s:'heart',  t:"Out of every star in the sky, I found you."},
  {s:'rose',   t:"You are my sunshine on every cloudy day 🌻"},
  {s:'text',   t:"The only name written in my heart."},
  {s:'heart',  t:NAME + ", will you be mine? ❤️"}
];
const lineEl = document.getElementById('line'), hint = document.getElementById('hint'),
      btns = document.getElementById('btns'), tap = document.getElementById('tap');
let step = 0;
function show(i){
  lineEl.classList.add('out');
  setTimeout(()=>{ lineEl.textContent = story[i].t; lineEl.classList.remove('out'); }, 450);
  if(i>0) go(story[i].s);
  if(i === story.length-1){ tap.style.display='none'; hint.style.display='none'; btns.style.display='flex'; }
}
show(0);
tap.addEventListener('click', ()=>{ if(step < story.length-1){ step++; show(step); } });

const noBtn = document.getElementById('no'), yesBtn = document.getElementById('yes');
const noTexts = ["Are you sure? 🥺","Think again 💭","Pretty please 🌹","Not allowed 😤"];
let n = 0;
function dodge(e){
  e.preventDefault(); n++;
  noBtn.textContent = noTexts[n%noTexts.length];
  noBtn.style.position='fixed';
  noBtn.style.left = (10+R()*(innerWidth-190))+'px';
  noBtn.style.top = (10+R()*(innerHeight-80))+'px';
  yesBtn.style.transform = 'scale('+Math.min(1+n*.12,1.7)+')';
}
noBtn.addEventListener('pointerenter',dodge);
noBtn.addEventListener('pointerdown',dodge);

yesBtn.addEventListener('click', ()=>{
  btns.style.display='none'; go('blast');
  lineEl.classList.add('out');
  setTimeout(()=>{ shapes.heart = heart(); go('heart'); }, 1400);
  setTimeout(()=>{
    lineEl.innerHTML = "She said yes! 🎉<br>" + NAME + ", you just made me the happiest person alive. Forever starts now 💞";
    lineEl.classList.remove('out');
  }, 1800);
});
</script>
</body>
</html>
